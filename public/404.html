<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Ada (hache) Cervera</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <script>
    (function () { try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (e) {} })();
  </script>
  <style>
    :root { --bg: #ffffff; --ink: #0a0a0a; --muted: #4f4f4f; --line: #e5e5e5; --accent: #c22e00; }
    [data-theme='dark'] { --bg: #0d0d0d; --ink: #f2f2f2; --muted: #b5b5b5; --line: #2a2a2a; --accent: #ff3c00; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 Inter, system-ui, sans-serif; }
    main { width: 100%; max-width: 40rem; }
    .code { font: 800 clamp(5rem, 22vw, 9rem)/0.9 Sora, system-ui, sans-serif; letter-spacing: -0.04em; color: var(--accent); }
    h1 { margin-top: 24px; font: 700 clamp(1.6rem, 4vw, 2.2rem)/1.15 Sora, system-ui, sans-serif; letter-spacing: -0.02em; }
    p { margin-top: 12px; color: var(--muted); }
    nav { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; font: 600 0.9375rem Sora, system-ui, sans-serif; }
    nav a:hover, nav a:focus-visible { background: var(--ink); color: var(--bg); }
    nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .es { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page does not exist, or not anymore.</h1>
    <p>The link may be old or mistyped. These do exist:</p>
    <nav aria-label="Pages">
      <a href="/">Home</a>
      <a href="/research/">Research</a>
    </nav>
    <div class="es" lang="es">
      <h2 class="sr" style="font: 700 1.1rem Sora, system-ui, sans-serif">Esta página no existe, o ya no.</h2>
      <p>Puede que el enlace sea antiguo o tenga una errata. Estas sí existen:</p>
      <nav aria-label="Páginas">
        <a href="/es/">Inicio</a>
        <a href="/research/es/">Investigaciones</a>
      </nav>
    </div>
  </main>
</body>
</html>
